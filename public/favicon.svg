<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with dark modern glass feel -->
  <rect width="64" height="64" rx="16" fill="#090d16" />
  <rect width="64" height="64" rx="16" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Atom Orbit 1 (Tilted -35 deg) -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#orbit-grad)" stroke-width="2.5" transform="rotate(-35 32 32)" filter="url(#glow)" />

  <!-- Atom Orbit 2 (Tilted 35 deg) -->
  <ellipse cx="32" cy="32" rx="22" ry="8.5" stroke="url(#orbit-grad)" stroke-width="2.5" transform="rotate(35 32 32)" />

  <!-- Central Nucleus / Quantum Core with glow -->
  <circle cx="32" cy="32" r="6" fill="url(#core-grad)" />
  <circle cx="32" cy="32" r="3" fill="#ffffff" />

  <!-- Small electrons on orbits for crisp physics aesthetic -->
  <circle cx="15" cy="20" r="2.2" fill="#00f2fe" />
  <circle cx="49" cy="44" r="2.2" fill="#7000ff" />
  <circle cx="49" cy="20" r="2.2" fill="#38bdf8" />
</svg>
